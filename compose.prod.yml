# For Dokploy: set the variables below in the Environment tab and, in the Domains tab,
# point PANEL_HOST at this service on port 3000 with HTTPS on.
# The first start creates the panel user admin and prints its password once in the logs: look for "Panel login".
services:
  bot:
    image: registry.delirio.org/chiken/moddy:${IMAGE_TAG:-latest}
    environment:
      # A missing value stops the deploy before it replaces a working bot.
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      APP_ENV: production
      PANEL_HOST: ${PANEL_HOST:?Set PANEL_HOST to the panel domain}
    volumes:
      - data:/app/data
    networks:
      - dokploy-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # One instance only, and the old one stops first. Telegram allows a single process to poll a
    # token: a second one gets 409 and exits. Updates wait at Telegram during the restart.
    # update_config only applies when Dokploy deploys this as a Stack.
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s

networks:
  dokploy-network:
    external: true

volumes:
  data:
