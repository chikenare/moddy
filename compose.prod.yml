name: telegram-bot

services:
  bot:
    image: registry.delirio.org/chiken/telegram-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      target: prod
    env_file: .env
    volumes:
      - data:/app/data
    restart: unless-stopped

  bot-front:
    image: registry.delirio.org/chiken/telegram-bot-front:${IMAGE_TAG:-latest}
    build:
      context: ./front
      target: prod
    depends_on: [bot]
    restart: unless-stopped
    ports: ["127.0.0.1:8088:80"]

volumes:
  data:
