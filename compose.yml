name: telegram-bot

services:
  bot:
    build:
      context: .
      target: dev
    env_file: .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - data:/app/data
    restart: unless-stopped

networks:
  default:
    name: traefik
    external: true

volumes:
  node_modules:
  data:
